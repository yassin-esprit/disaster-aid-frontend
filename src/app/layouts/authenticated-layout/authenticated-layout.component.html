<div class="min-h-screen text-on-surface">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Top header -->
  <app-header
    *ngIf="showHeader"
    [pageTitle]="pageTitle"
    [breadcrumb]="breadcrumb"
    userName="Amina"
    userRole="Volunteer"
  >
  </app-header>

  <!-- Main content — offset for sidebar and header -->
  <main
    class="md:ml-[240px] pb-20 md:pb-0 min-h-screen"
    [class.pt-16]="showHeader"
    [class.pt-0]="!showHeader"
  >
    <div class="p-6 md:p-8">
      <ng-content></ng-content>
    </div>
  </main>

  <!-- Mobile bottom nav -->
  <app-mobile-nav></app-mobile-nav>
</div>
