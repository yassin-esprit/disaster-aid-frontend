<div class="font-body text-on-surface antialiased">
  <!-- ── Nav ─────────────────────────────────────── -->
  <nav class="fixed top-0 w-full h-16 z-50 bg-white/10 backdrop-blur-md shadow-[0_0_40px_rgba(108,92,231,0.12)]">
    <div class="flex justify-between items-center px-8 w-full max-w-screen-2xl mx-auto h-full relative">
      <!-- Logo -->
      <a routerLink="/home" class="text-2xl font-black text-white tracking-tighter flex items-center gap-2">
        CPS
        <span class="text-xs font-mono text-primary px-2 py-0.5 bg-primary/10 rounded-full tracking-normal"> HUB </span>
      </a>

      <!-- Nav links -->
      <div class="hidden md:flex items-center space-x-8 font-medium text-sm tracking-tight">
        <a routerLink="/home" routerLinkActive="text-violet-400 border-b-2 border-violet-500 pb-1 font-semibold"
           [routerLinkActiveOptions]="{exact:true}" class="text-slate-300 hover:text-white transition-colors">Home</a>
        <a routerLink="/missions" routerLinkActive="text-violet-400 border-b-2 border-violet-500 pb-1 font-semibold"
           class="text-slate-300 hover:text-white transition-colors">Missions</a>
        <a routerLink="/report" routerLinkActive="text-violet-400 border-b-2 border-violet-500 pb-1 font-semibold"
           class="text-slate-300 hover:text-white transition-colors">Report</a>
        <a routerLink="/help" routerLinkActive="text-violet-400 border-b-2 border-violet-500 pb-1 font-semibold"
           class="text-slate-300 hover:text-white transition-colors">Get Help</a>
        <a routerLink="/incidents" routerLinkActive="text-violet-400 border-b-2 border-violet-500 pb-1 font-semibold"
           class="text-slate-300 hover:text-white transition-colors">My Reports</a>

        <a routerLink="/alerts" routerLinkActive="text-violet-400 border-b-2 border-violet-500 pb-1 font-semibold"
           class="text-slate-300 hover:text-white transition-colors">Alerts</a>
        <a routerLink="/sensors" routerLinkActive="text-violet-400 border-b-2 border-violet-500 pb-1 font-semibold"
           class="text-slate-300 hover:text-white transition-colors">Sensors</a>
        <a routerLink="/evacuation" routerLinkActive="text-violet-400 border-b-2 border-violet-500 pb-1 font-semibold"
           class="text-slate-300 hover:text-white transition-colors">Evacuation</a>
        <a routerLink="/geofence" routerLinkActive="text-violet-400 border-b-2 border-violet-500 pb-1 font-semibold"
           class="text-slate-300 hover:text-white transition-colors">Geofence Zones</a>
        <a routerLink="/spatial" routerLinkActive="text-violet-400 border-b-2 border-violet-500 pb-1 font-semibold"
           class="text-slate-300 hover:text-white transition-colors">Spatial Queries</a>
        <a routerLink="/reviews" routerLinkActive="text-violet-400 border-b-2 border-violet-500 pb-1 font-semibold"
           class="text-slate-300 hover:text-white transition-colors">Reviews</a>
        <a routerLink="/nearby-shelters" routerLinkActive="text-violet-400 border-b-2 border-violet-500 pb-1 font-semibold"
           class="text-slate-300 hover:text-white transition-colors">Nearby Shelters</a>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-4">
        <button class="material-symbols-outlined text-slate-300 hover:text-white transition-all hover:bg-white/5 p-2 rounded-full">
          notifications
        </button>
        <div class="h-6 w-[1px] bg-white/10 mx-2"></div>
        <ng-container *ngIf="isAuthenticated; else showSignIn">
          <a routerLink="/frontoffice-profile" class="text-slate-300 text-sm font-medium hover:text-white transition-colors">
            Profile
          </a>
          <a (click)="logout()" class="bg-primary text-on-primary px-5 py-2 rounded-full text-sm font-bold shadow-lg shadow-primary/20 hover:scale-105 active:scale-95 transition-all">
            Logout
          </a>
        </ng-container>
        <ng-template #showSignIn>
          <a routerLink="/login" class="text-slate-300 text-sm font-medium hover:text-white transition-colors">Sign In</a>
          <a routerLink="/login" class="bg-primary text-on-primary px-5 py-2 rounded-full text-sm font-bold shadow-lg shadow-primary/20 hover:scale-105 active:scale-95 transition-all">
            Get Started
          </a>
        </ng-template>
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <main class="pt-16 min-h-screen">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="border-t border-white/5 bg-slate-950/80 backdrop-blur-xl mt-16">
    <div class="max-w-7xl mx-auto px-8 py-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p class="text-slate-500 text-xs">Powered by DisasterAid ⊕ VolunteerHub © 2025</p>
      <div class="flex gap-6 text-xs text-slate-500">
        <a routerLink="/home" class="hover:text-white transition-colors">Home</a>
        <a routerLink="/report" class="hover:text-white transition-colors">Report</a>
        <a routerLink="/missions" class="hover:text-white transition-colors">Missions</a>
      </div>
    </div>
  </footer>

  <!-- Chat overlay + FAB (only when authenticated) -->
  <div class="chat-overlay" *ngIf="isAuthenticated && isChatOpen" (click)="closeChat()"></div>

  <button *ngIf="isAuthenticated" type="button" class="chat-fab" (click)="toggleChat()" aria-label="Open chat">
    <span class="material-symbols-outlined">chat</span>
  </button>

  <div class="chat-drawer" [class.open]="isAuthenticated && isChatOpen">
    <div class="chat-drawer-header">
      <h3>Discussions</h3>
      <button type="button" class="chat-close-btn" (click)="closeChat()">✕</button>
    </div>
    <div class="chat-drawer-content">
      <app-chat></app-chat>
    </div>
  </div>
</div>
