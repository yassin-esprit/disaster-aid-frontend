<div class="min-h-screen text-on-surface">
	<header class="fixed top-0 w-full h-16 z-50 bg-white/10 backdrop-blur-md shadow-[0_0_40px_rgba(108,92,231,0.12)]">
		<div class="flex justify-between items-center px-8 w-full max-w-screen-2xl mx-auto h-full relative">
			<a routerLink="/" class="text-2xl font-black text-white tracking-tighter flex items-center gap-2">
				CPS
				<span class="text-xs font-mono text-primary px-2 py-0.5 bg-primary/10 rounded-full tracking-normal">HUB</span>
			</a>

			<div class="hidden md:flex items-center space-x-8 font-medium text-sm tracking-tight">
				<a
					routerLink="/"
					routerLinkActive="text-violet-400 border-b-2 border-violet-500"
					[routerLinkActiveOptions]="{ exact: true }"
					class="text-slate-300 hover:text-white transition-colors pb-1"
				>Home</a>
				<a
					routerLink="/resource"
					routerLinkActive="text-white"
					class="text-slate-300 hover:text-white transition-colors"
				>Resources</a>
				<a
					routerLink="/shelter"
					routerLinkActive="text-white"
					class="text-slate-300 hover:text-white transition-colors"
				>Shelter</a>
				<a
					routerLink="/reviews"
					routerLinkActive="text-white border-b-2 border-white/70"
					class="text-slate-300 hover:text-white transition-colors pb-1"
				>Reviews</a>
				<a
					routerLink="/reports"
					routerLinkActive="text-white border-b-2 border-white/70"
					class="text-slate-300 hover:text-white transition-colors pb-1"
				>Reports</a>
				<a
					routerLink="/nearby-shelters"
					routerLinkActive="text-white border-b-2 border-white/70"
					class="text-slate-300 hover:text-white transition-colors pb-1"
				>Nearby Shelters</a>
				<a
					routerLink="/evacuation-routes"
					routerLinkActive="text-white"
					class="text-slate-300 hover:text-white transition-colors"
				>Evacuation Routes</a>
			</div>

			<div class="flex items-center gap-4">
				<button
					class="material-symbols-outlined text-slate-300 hover:text-white transition-all hover:bg-white/5 p-2 rounded-full"
					type="button"
					aria-label="Notifications"
				>
					notifications
				</button>
				<div class="h-6 w-[1px] bg-white/10 mx-2"></div>
				<a routerLink="/login" class="text-slate-300 text-sm font-medium hover:text-white transition-colors">Sign In</a>
				<a
					routerLink="/login"
					class="bg-primary text-on-primary px-5 py-2 rounded-full text-sm font-bold shadow-lg shadow-primary/20 hover:scale-105 active:scale-95 transition-all"
				>
					Get Started
				</a>
			</div>

			<div class="bg-gradient-to-r from-violet-500/20 to-transparent h-[1px] bottom-0 absolute left-0 right-0"></div>
		</div>
	</header>

	<main class="pt-16 pb-10">
		<div class="max-w-screen-2xl mx-auto px-4 md:px-8">
			<ng-content></ng-content>
		</div>
	</main>
</div>
