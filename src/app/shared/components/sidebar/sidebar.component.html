<!-- Desktop sidebar -->
<aside
  class="hidden md:flex flex-col w-[240px] flex-shrink-0 bg-slate-900/60 backdrop-blur-2xl border-r border-white/5 py-6 gap-2 h-full"
>
  <!-- Brand -->
  <div class="px-6 mb-4">
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-lg bg-primary/20 flex items-center justify-center border border-primary/30"
      >
        <span class="material-symbols-outlined text-primary fill-icon">shield</span>
      </div>
      <div>
        <h2 class="text-xl font-bold text-slate-100 tracking-tight">Disaster Aid</h2>
        <p class="text-[10px] uppercase tracking-widest text-primary/70 font-bold">CPS Hub</p>
      </div>
    </div>
  </div>

  <!-- User info chip -->
  <div class="px-4 mb-2">
    <div class="flex items-center gap-2 bg-white/5 rounded-xl px-3 py-2 border border-white/5">
      <div class="w-7 h-7 rounded-full bg-primary/30 flex items-center justify-center flex-shrink-0">
        <span class="text-xs font-bold text-primary">{{ userName[0]?.toUpperCase() }}</span>
      </div>
      <div class="min-w-0">
        <p class="text-xs font-semibold text-slate-200 truncate">{{ userName }}</p>
        <p class="text-[10px] text-primary/70 font-bold uppercase tracking-wide truncate">{{ userRole }}</p>
      </div>
    </div>
  </div>

  <!-- Nav items -->
  <nav class="flex-1 flex flex-col gap-1">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="bg-white/10 text-white shadow-[inset_4px_0_0_var(--accent)]"
      [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' || item.route === '/landing' }"
      class="text-slate-400 hover:text-slate-200 py-3 px-4 ml-2 mr-4 flex items-center gap-3 transition-all hover:bg-white/5 rounded-lg"
      [style.--accent]="accentColor"
    >
      <span class="material-symbols-outlined">{{ item.icon }}</span>
      <span class="text-[13px] font-medium tracking-wide uppercase">{{ item.label }}</span>
    </a>
  </nav>

  <!-- Logout -->
  <div class="px-4 mt-auto">
    <button
      type="button"
      (click)="onLogout()"
      class="block w-full bg-red-500/80 text-white py-3 rounded-lg font-bold text-xs uppercase tracking-widest text-center hover:bg-red-500 transition-all active:scale-95"
    >
      Logout
    </button>
  </div>
</aside>
