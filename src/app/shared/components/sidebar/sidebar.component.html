<!-- Desktop sidebar -->
<aside
  class="fixed left-0 top-0 h-full w-[240px] z-[60] bg-slate-900/60 backdrop-blur-2xl border-r border-white/5 flex flex-col py-6 gap-2 shadow-[10px_0_30px_rgba(0,0,0,0.5)] hidden md:flex"
>
  <!-- Brand -->
  <div class="px-6 mb-8">
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-lg bg-primary/20 flex items-center justify-center border border-primary/30"
      >
        <span class="material-symbols-outlined text-primary fill-icon"
          >shield</span
        >
      </div>
      <div>
        <h2 class="text-xl font-bold text-slate-100 tracking-tight">
          Disaster Aid
        </h2>
        <p
          class="text-[10px] uppercase tracking-widest text-primary/70 font-bold"
        >
          CPS Hub
        </p>
      </div>
    </div>
  </div>

  <!-- Nav items -->
  <nav class="flex-1 flex flex-col gap-1">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="bg-white/10 text-white shadow-[inset_4px_0_0_var(--accent)]"
      [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
      class="text-slate-400 hover:text-slate-200 py-3 px-4 ml-2 mr-4 flex items-center gap-3 transition-all hover:bg-white/5 rounded-lg"
      [style.--accent]="accentColor"
    >
      <span class="material-symbols-outlined">{{ item.icon }}</span>
      <span class="text-[13px] font-medium tracking-wide uppercase">{{
        item.label
      }}</span>
    </a>
  </nav>

  <!-- CTA -->
  <div class="px-4 mt-auto">
    <a
      [routerLink]="ctaRoute"
      class="block w-full bg-primary text-on-primary py-3 rounded-lg font-bold text-xs uppercase tracking-widest text-center hover:shadow-[0_0_20px_rgba(108,92,231,0.4)] transition-all active:scale-95"
    >
      {{ ctaLabel }}
    </a>
  </div>
</aside>
