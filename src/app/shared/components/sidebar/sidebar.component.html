<aside class="fixed left-0 top-0 h-full w-[240px] z-[60] bg-slate-900/60 backdrop-blur-2xl border-r border-white/5 flex flex-col py-6 gap-2 shadow-[10px_0_30px_rgba(0,0,0,0.5)] hidden md:flex">

  <!-- Brand -->
  <div class="px-6 mb-8">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg flex items-center justify-center border"
           [style]="'background:' + accentColor + '30;border-color:' + accentColor + '50'">
        <span class="material-symbols-outlined fill-icon"
              [style]="'color:' + accentColor">
          {{ role === 'ADMIN' ? 'admin_panel_settings' : 'shield' }}
        </span>
      </div>
      <div>
        <h2 class="text-base font-bold text-slate-100 tracking-tight">
          {{ role === 'ADMIN' ? 'Admin Panel' : 'Disaster Aid' }}
        </h2>
        <p class="text-[10px] uppercase tracking-widest font-bold"
           [style]="'color:' + accentColor + '99'">
          {{ role === 'ADMIN' ? 'Command Center' : 'CPS Hub' }}
        </p>
      </div>
    </div>
  </div>

  <!-- Nav items -->
  <nav class="flex-1 flex flex-col gap-1 overflow-y-auto scrollbar-thin">
    <a *ngFor="let item of navItems"
       [routerLink]="item.route"
       routerLinkActive="bg-white/10 text-white"
       [routerLinkActiveOptions]="{exact: false}"
       class="text-slate-400 hover:text-slate-200 py-3 px-4 ml-2 mr-4 flex items-center gap-3 transition-all hover:bg-white/5 rounded-lg text-[13px] font-medium tracking-wide uppercase relative"
       #rla="routerLinkActive">
      <span class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-5 rounded-r-full transition-all"
            [style]="rla.isActive ? 'background:' + accentColor : 'background:transparent'"></span>
      <span class="material-symbols-outlined"
            [style]="rla.isActive ? 'color:' + accentColor : ''">{{ item.icon }}</span>
      {{ item.label }}
    </a>
  </nav>

  <!-- CTA -->
  <div class="px-4 mt-auto">
    <a [routerLink]="ctaRoute"
       class="block w-full py-3 rounded-lg font-bold text-xs uppercase tracking-widest text-center transition-all active:scale-95 text-white"
       [style]="'background:' + accentColor + ';box-shadow:0 0 20px ' + accentColor + '40'">
      {{ ctaLabel }}
    </a>
  </div>

  <!-- Download analytics report (admin only) -->
  <div *ngIf="isAdmin" class="px-4 mt-3">
    <button
      type="button"
      (click)="downloadReport()"
      [disabled]="downloadingReport"
      class="block w-full py-3 rounded-lg font-bold text-xs uppercase tracking-widest text-center transition-all active:scale-95 text-white bg-emerald-600/80 hover:bg-emerald-600 disabled:opacity-50 disabled:cursor-wait flex items-center justify-center gap-2"
    >
      <span class="material-symbols-outlined text-base">
        {{ downloadingReport ? 'hourglass_top' : 'download' }}
      </span>
      {{ downloadingReport ? 'Generating…' : 'Download Report' }}
    </button>
    <p *ngIf="reportError" class="text-[10px] text-red-300 mt-1 text-center break-words">
      {{ reportError }}
    </p>
  </div>

  <div class="px-4 mt-3">
    <button
      type="button"
      (click)="onLogout()"
      class="block w-full bg-red-500/80 text-white py-3 rounded-lg font-bold text-xs uppercase tracking-widest text-center hover:bg-red-500 transition-all active:scale-95"
    >
      Logout
    </button>
  </div>
</aside>
