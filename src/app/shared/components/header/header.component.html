<header
  class="fixed top-0 w-full h-16 z-50 bg-slate-900/40 backdrop-blur-xl flex items-center justify-between px-8 shadow-[0_0_20px_rgba(108,92,231,0.15)] md:pl-[272px]"
>
  <!-- Left: title + breadcrumb -->
  <div class="flex flex-col justify-center">
    <h1 class="text-lg font-black tracking-tighter text-slate-100 leading-none">
      {{ pageTitle }}
    </h1>
    <p
      *ngIf="breadcrumb"
      class="text-[10px] text-slate-500 uppercase tracking-widest mt-0.5"
    >
      {{ breadcrumb }}
    </p>
  </div>

  <!-- Right: search, actions, avatar -->
  <div class="flex items-center gap-4 relative">
    <!-- Search -->
    <div class="relative hidden sm:block">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        placeholder="Search..."
        class="bg-white/5 border-none rounded-full px-4 py-1.5 text-xs w-48 focus:ring-1 focus:ring-primary text-on-surface outline-none"
      />
    </div>

    <!-- Analytics shortcut -->
    <a
      routerLink="/analytics"
      class="hidden sm:inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold text-slate-100 bg-primary/20 hover:bg-primary/30 border border-primary/40 transition"
    >
      <span class="material-symbols-outlined text-sm">analytics</span>
      Analytics
    </a>

    <!-- Notification bell -->
    <button
      (click)="toggleNotifications()"
      class="relative text-slate-400 hover:text-white transition-all active:scale-95 p-2 rounded-full hover:bg-white/5"
    >
      <span class="material-symbols-outlined">notifications</span>
      <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-error"></span>
    </button>

    <!-- Notification dropdown -->
    <div
      *ngIf="showNotifications"
      class="absolute top-12 right-16 w-80 glass-3 rounded-2xl border border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.4)] z-50 overflow-hidden"
    >
      <div
        class="flex items-center justify-between px-4 py-3 border-b border-white/5"
      >
        <span class="text-xs font-bold uppercase tracking-widest text-on-surface-variant">Notifications</span>
        <button class="text-[10px] text-primary font-bold hover:underline">Mark all read</button>
      </div>
      <div class="divide-y divide-white/5">
        <div
          *ngFor="let n of notifications"
          class="flex gap-3 px-4 py-3 hover:bg-white/5 transition-colors cursor-pointer"
        >
          <div
            class="mt-1.5 w-2 h-2 rounded-full shrink-0"
            [ngClass]="dotColor(n.type)"
          ></div>
          <div>
            <p class="text-[10px] text-on-surface-variant mb-0.5">{{ n.time }}</p>
            <p class="text-xs text-on-surface leading-relaxed">{{ n.message }}</p>
          </div>
        </div>
      </div>
      <div class="px-4 py-3 border-t border-white/5">
        <button class="text-xs font-bold text-primary hover:underline w-full text-center">View All</button>
      </div>
    </div>

    <!-- User info + Avatar -->
    <div class="flex items-center gap-2 cursor-default">
      <div class="hidden sm:flex flex-col items-end">
        <span class="text-xs font-semibold text-slate-200 leading-none">{{ userName }}</span>
        <span class="text-[10px] text-primary/70 font-bold uppercase tracking-wide mt-0.5">{{ userRole }}</span>
      </div>
      <div
        class="w-8 h-8 rounded-full border border-primary/50 overflow-hidden bg-surface-container-high flex items-center justify-center"
      >
        <img
          *ngIf="userAvatar"
          [src]="userAvatar"
          [alt]="userName"
          class="w-full h-full object-cover"
        />
        <span *ngIf="!userAvatar" class="text-xs font-bold text-primary">{{
            userName[0]?.toUpperCase()
          }}</span>
      </div>
    </div>
  </div>

  <!-- Bottom accent line -->
  <div
    class="bg-gradient-to-r from-primary/10 to-transparent h-[1px] bottom-0 absolute w-full left-0"
  ></div>
</header>
