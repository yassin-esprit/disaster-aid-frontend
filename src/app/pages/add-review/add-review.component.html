<app-front-office-layout>
    <section class="glass-1 rounded-2xl border border-white/10 p-6 space-y-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
                <h2 class="text-2xl font-black">Laisser un Avis</h2>
                <p class="text-sm text-on-surface-variant mt-1">
                    Donnez une note et un commentaire sur une organisation ou un volontaire.
                </p>
            </div>
            <a routerLink="/reviews" class="px-4 py-2 rounded-lg bg-white/10 border border-white/10 text-xs font-bold uppercase tracking-widest">
        Retour Avis
      </a>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <label class="field">
        <span>ID Auteur</span>
        <input type="number" min="1" formControlName="authorId" />
      </label>

            <label class="field">
        <span>ID Cible</span>
        <input type="number" min="1" formControlName="targetId" />
      </label>

            <label class="field">
        <span>Type Cible</span>
        <select formControlName="targetType">
          <option value="ORGANISATION">ORGANISATION</option>
          <option value="VOLUNTEER">VOLUNTEER</option>
        </select>
      </label>

            <label class="field">
        <span>Note (1-5)</span>
        <input type="number" min="1" max="5" formControlName="rating" />
      </label>

            <label class="field md:col-span-2">
        <span>Commentaire</span>
        <textarea rows="5" formControlName="body" placeholder="Partagez votre experience..."></textarea>
      </label>

            <label class="field md:col-span-2">
        <span>Opportunity ID (optionnel)</span>
        <input type="number" min="1" formControlName="opportunityId" />
      </label>

            <div class="md:col-span-2 flex flex-wrap items-center gap-3">
                <button type="submit" [disabled]="isSubmitting" class="px-6 py-2.5 rounded-lg bg-primary text-on-primary text-xs font-bold uppercase tracking-widest disabled:opacity-60">
          {{ isSubmitting ? 'Sending...' : 'Soumettre Avis' }}
        </button>

                <p *ngIf="successMessage" class="text-sm font-semibold text-tertiary-dim">{{ successMessage }}</p>
                <p *ngIf="errorMessage" class="text-sm font-semibold text-error">{{ errorMessage }}</p>
            </div>
        </form>
    </section>
</app-front-office-layout>
