<app-front-office-layout>
    <section class="glass-1 rounded-2xl border border-white/10 p-6 space-y-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
                <h2 class="text-2xl font-black">Leave a Review</h2>
                <p class="text-sm text-on-surface-variant mt-1">Share a rating and your feedback.</p>
            </div>
            <a routerLink="/reviews" class="px-4 py-2 rounded-lg bg-white/10 border border-white/10 text-xs font-bold uppercase tracking-widest">
        Back to Reviews
      </a>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="review-form grid grid-cols-1 md:grid-cols-2 gap-4">
            <label class="field">
        <span>Target Type</span>
        <select formControlName="targetType">
          <option value="ORGANISATION">RESOURCE</option>
          <option value="SHELTER">SHELTER</option>
        </select>
      </label>

            <label class="field">
        <span>Rating (1-5)</span>
        <div class="star-rating" (mouseleave)="hoverRating = 0">
          <button
            *ngFor="let star of stars"
            type="button"
            class="star-btn"
            [class.star-active]="displayStarValue(star)"
            (mouseenter)="hoverRating = star"
            (click)="setRating(star)"
            [attr.aria-label]="'Set rating to ' + star"
            [attr.title]="star + ' stars'"
          >
            ★
          </button>
        </div>
        <p class="rating-value">{{ form.controls.rating.value }} / 5</p>
        <small class="hint" *ngIf="form.controls.rating.touched && form.controls.rating.invalid">
          Rating must be between 1 and 5.
        </small>
      </label>

            <label class="field md:col-span-2">
        <span>Comment</span>
        <textarea rows="5" formControlName="body" placeholder="Share your experience..."></textarea>
        <small class="hint" *ngIf="form.controls.body.touched && form.controls.body.invalid">
          Comment must contain at least 5 characters.
        </small>
      </label>

            <div class="md:col-span-2 flex flex-wrap items-center gap-3">
                <button type="submit" [disabled]="isSubmitting" class="px-6 py-2.5 rounded-lg bg-primary text-on-primary text-xs font-bold uppercase tracking-widest disabled:opacity-60">
          {{ isSubmitting ? 'Sending...' : 'Submit Review' }}
        </button>

                <p *ngIf="successMessage" class="text-sm font-semibold text-tertiary-dim">{{ successMessage }}</p>
                <p *ngIf="errorMessage" class="text-sm font-semibold text-error">{{ errorMessage }}</p>
            </div>
        </form>
    </section>
</app-front-office-layout>
