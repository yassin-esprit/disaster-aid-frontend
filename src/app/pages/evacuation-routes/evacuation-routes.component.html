<app-authenticated-layout pageTitle="Evacuation Routes" breadcrumb="Front Office / Evacuation Routes">
    <section class="space-y-6">
        <h2 class="text-2xl font-black">Routes d'evacuation</h2>

        <div class="glass-1 rounded-2xl border border-white/10 overflow-hidden">
            <table class="w-full min-w-[850px]">
                <thead class="bg-white/5 text-left text-xs uppercase tracking-widest text-on-surface-variant">
                    <tr>
                        <th class="px-4 py-3">Route</th>
                        <th class="px-4 py-3">Zone</th>
                        <th class="px-4 py-3">Distance</th>
                        <th class="px-4 py-3">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of routes" class="border-t border-white/5 hover:bg-white/5">
                        <td class="px-4 py-3 font-semibold">{{ item.name }}</td>
                        <td class="px-4 py-3">{{ item.zone }}</td>
                        <td class="px-4 py-3">{{ item.distanceKm }} km</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 rounded text-[11px] font-bold uppercase" [ngClass]="item.status === 'OPEN' ? 'bg-tertiary-dim/20 text-tertiary-dim' : 'bg-error/20 text-error'">
                {{ item.status }}
              </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</app-authenticated-layout>
