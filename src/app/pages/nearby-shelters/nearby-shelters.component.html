<app-front-office-layout>
  <section class="space-y-6">
    <div class="flex items-center justify-between">
      <h2 class="text-2xl font-black">Shelters available near you</h2>
      <div class="mt-2 flex items-center gap-2">
        <a
          routerLink="/shelter-recommender"
          class="px-4 py-2 rounded-lg bg-primary/20 text-primary border border-primary/30 text-xs font-bold uppercase tracking-widest"
        >
          Recommend
        </a>
        <button
          type="button"
          (click)="loadShelters()"
          class="px-4 py-2 rounded-lg bg-secondary/20 text-secondary border border-secondary/30 text-xs font-bold uppercase tracking-widest"
        >
          Refresh
        </button>
      </div>
    </div>

    <div *ngIf="isLoading" class="glass-1 rounded-xl border border-white/10 p-6 text-on-surface-variant">
      Loading...
    </div>

    <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
      <article *ngFor="let item of shelters" class="glass-1 rounded-2xl border border-white/10 p-5">
        <div class="flex items-start justify-between gap-3">
          <h3 class="text-lg font-black">{{ item.name }}</h3>
          <span
            class="px-2 py-1 rounded text-[11px] font-bold uppercase"
            [ngClass]="isAvailable(item) ? 'bg-tertiary-dim/20 text-tertiary-dim' : 'bg-error/20 text-error'"
          >
            {{ isAvailable(item) ? 'AVAILABLE' : 'FULL' }}
          </span>
        </div>

        <p class="text-sm text-on-surface-variant mt-2">{{ item.address }}</p>

        <div class="mt-4 grid grid-cols-2 gap-3 text-sm">
          <div class="bg-white/5 rounded-lg p-3">
            <p class="text-on-surface-variant text-xs uppercase">Capacity</p>
            <p class="font-bold">{{ item.capacity }}</p>
          </div>
          <div class="bg-white/5 rounded-lg p-3">
            <p class="text-on-surface-variant text-xs uppercase">Remaining</p>
            <p class="font-bold">{{ remaining(item) }}</p>
          </div>
        </div>

        <a
          [routerLink]="['/shelter-details', item.shelterId]"
          class="inline-block mt-5 px-4 py-2 rounded-lg bg-primary/20 text-primary border border-primary/30 text-xs font-bold uppercase tracking-widest"
        >
          More details
        </a>
      </article>

      <div
        *ngIf="shelters.length === 0"
        class="glass-1 rounded-xl border border-white/10 p-6 text-on-surface-variant md:col-span-2 xl:col-span-3"
      >
        No shelters to display.
      </div>
    </div>

    <div class="chat-shell fixed left-3 right-3 bottom-3 md:left-6 md:right-auto md:w-[410px] z-30">
      <div class="chat-card">
        <button
          type="button"
          (click)="toggleChat()"
          class="chat-head"
          [attr.aria-expanded]="chatOpen"
          aria-label="Toggle CPS-SAFE chat"
        >
          <div class="chat-title-wrap">
            <span class="chat-live-dot"></span>
            <div>
              <p class="chat-tag">CPS-SAFE</p>
              <p class="chat-title">Emergency Assistant</p>
            </div>
          </div>
          <span class="chat-toggle">{{ chatOpen ? 'Minimize' : 'Open' }}</span>
        </button>

        <div *ngIf="chatOpen" class="chat-body">
          <div class="chat-stream" role="log" aria-live="polite">
            <div
              *ngFor="let msg of chatMessages"
              class="chat-row"
              [ngClass]="msg.role === 'assistant' ? 'chat-row-assistant' : 'chat-row-user'"
            >
              <div class="chat-bubble" [ngClass]="msg.role === 'assistant' ? 'chat-bubble-assistant' : 'chat-bubble-user'">
                <p class="chat-text">{{ msg.text }}</p>
                <span class="chat-time">{{ msg.time }}</span>
              </div>
            </div>
          </div>

          <div class="chat-quick-actions">
            <button type="button" (click)="useQuickPrompt('Flood, water is rising and I am not safe')">Flood</button>
            <button type="button" (click)="useQuickPrompt('Fire with heavy smoke, one person has trouble breathing')">Fire</button>
            <button type="button" (click)="useQuickPrompt('Power outage, we are safe, no injuries')">Outage</button>
            <button type="button" (click)="useQuickPrompt('Hello')">Hello</button>
          </div>

          <form class="chat-form" (ngSubmit)="sendChatMessage()">
            <input
              type="text"
              [(ngModel)]="chatInput"
              name="chatInput"
              placeholder="Describe your emergency situation..."
              autocomplete="off"
            />
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>
  </section>
</app-front-office-layout>
