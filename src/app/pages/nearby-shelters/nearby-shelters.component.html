<app-authenticated-layout pageTitle="Nearby Shelters" breadcrumb="Citizen / Nearby Shelters">
    <section class="space-y-6">
        <div class="flex items-center justify-between">
            <h2 class="text-2xl font-black">Shelters disponibles autour de vous</h2>
            <button type="button" (click)="loadShelters()" class="px-4 py-2 rounded-lg bg-secondary/20 text-secondary border border-secondary/30 text-xs font-bold uppercase tracking-widest">
        Refresh
      </button>
        </div>

        <div *ngIf="isLoading" class="glass-1 rounded-xl border border-white/10 p-6 text-on-surface-variant">
            Chargement...
        </div>

        <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
            <article *ngFor="let item of shelters" class="glass-1 rounded-2xl border border-white/10 p-5">
                <div class="flex items-start justify-between gap-3">
                    <h3 class="text-lg font-black">{{ item.name }}</h3>
                    <span class="px-2 py-1 rounded text-[11px] font-bold uppercase" [ngClass]="isAvailable(item) ? 'bg-tertiary-dim/20 text-tertiary-dim' : 'bg-error/20 text-error'">
            {{ isAvailable(item) ? 'AVAILABLE' : 'FULL' }}
          </span>
                </div>

                <p class="text-sm text-on-surface-variant mt-2">{{ item.address }}</p>

                <div class="mt-4 grid grid-cols-2 gap-3 text-sm">
                    <div class="bg-white/5 rounded-lg p-3">
                        <p class="text-on-surface-variant text-xs uppercase">Capacite</p>
                        <p class="font-bold">{{ item.capacity }}</p>
                    </div>
                    <div class="bg-white/5 rounded-lg p-3">
                        <p class="text-on-surface-variant text-xs uppercase">Restante</p>
                        <p class="font-bold">{{ remaining(item) }}</p>
                    </div>
                </div>

                <a [routerLink]="['/shelter-details', item.shelterId]" class="inline-block mt-5 px-4 py-2 rounded-lg bg-primary/20 text-primary border border-primary/30 text-xs font-bold uppercase tracking-widest">
          Voir details
        </a>
            </article>

            <div *ngIf="shelters.length === 0" class="glass-1 rounded-xl border border-white/10 p-6 text-on-surface-variant md:col-span-2 xl:col-span-3">
                Aucun shelter a afficher.
            </div>
        </div>
    </section>
</app-authenticated-layout>
