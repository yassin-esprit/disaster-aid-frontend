<section class="max-w-4xl mx-auto">
        <div *ngIf="isLoading" class="glass-1 rounded-xl border border-white/10 p-6 text-on-surface-variant">
            Chargement des details...
        </div>

        <div *ngIf="!isLoading && shelter" class="glass-1 rounded-2xl border border-white/10 p-6 md:p-8 space-y-6">
            <div class="flex items-center justify-between">
                <h2 class="text-3xl font-black">{{ shelter.name }}</h2>
                <span class="px-2 py-1 rounded bg-secondary/20 text-secondary text-xs font-bold uppercase">
          {{ shelter.status }}
        </span>
            </div>

            <p class="text-on-surface-variant">{{ shelter.address }}</p>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white/5 rounded-lg p-4">
                    <p class="text-xs uppercase text-on-surface-variant">Capacite totale</p>
                    <p class="text-2xl font-black">{{ shelter.capacity }}</p>
                </div>
                <div class="bg-white/5 rounded-lg p-4">
                    <p class="text-xs uppercase text-on-surface-variant">Occupants actuels</p>
                    <p class="text-2xl font-black">{{ shelter.currentOccupancy }}</p>
                </div>
                <div class="bg-white/5 rounded-lg p-4">
                    <p class="text-xs uppercase text-on-surface-variant">Capacite restante</p>
                    <p class="text-2xl font-black text-tertiary-dim">{{ remaining() }}</p>
                </div>
            </div>

            <div>
                <p class="text-sm text-on-surface-variant">Localisation:</p>
                <a [href]="shelter.locationUrl" target="_blank" rel="noopener" class="text-primary underline break-all">
          {{ shelter.locationUrl }}
        </a>
            </div>

            <a routerLink="/nearby-shelters" class="inline-block px-4 py-2 rounded-lg bg-white/10 border border-white/10 text-xs font-bold uppercase tracking-widest">
        Retour
      </a>
        </div>

        <div *ngIf="!isLoading && !shelter" class="glass-1 rounded-xl border border-white/10 p-6 text-on-surface-variant">
            Shelter introuvable.
        </div>
    </section>
